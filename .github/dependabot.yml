# Atualizações de dependências (os alertas de segurança do Dependabot são ligados em Settings → Code security).
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      # Boot, Framework, Security, Data e springdoc andam juntos (o BOM do Boot fixa Jackson, Hibernate, Flyway,
      # Testcontainers, JUnit). Major do Boot é migração, não um bump: só com o CI verde e revisão.
      spring:
        patterns: ["org.springframework*", "io.spring*", "org.springdoc*"]
      quality-plugins:
        patterns: ["org.jacoco*", "com.github.spotbugs*", "com.puppycrawl*", "org.apache.maven.plugins*", "org.owasp*"]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react*", "eslint-config-next", "@next/*"]
      lint-test:
        patterns: ["eslint*", "typescript-eslint", "stylelint*", "vitest", "@vitest/*", "jsdom", "@testing-library/*", "@commitlint/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      # Só JVM LTS em produção (21, 25, 29...). Versões não-LTS perdem as correções de segurança em 6 meses;
      # a troca de LTS é manual, junto com o teste da imagem.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "maven"
        update-types: ["version-update:semver-major"]
