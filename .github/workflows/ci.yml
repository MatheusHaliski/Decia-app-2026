# CI do Work Station / DECIA (ARQUITETURA §3.4): nada entra no main sem build, testes, gates de qualidade e varredura
# de segredos. Branch protection na main: 1 revisão + estes jobs verdes + sem push direto.
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  backend:
    name: API (Java 21 · mvn verify · JaCoCo · Checkstyle · SpotBugs · Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, testes-guarda, cobertura e análise estática
        run: mvn -B -ntp verify
      - name: Relatórios (cobertura, surefire)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            **/target/site/jacoco/
            **/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Front (Node 22 · lint · typecheck · vitest · build · audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-fund
      - name: Lint (ESLint + stylelint, inclui as proibições do design system)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Testes (vitest)
        run: npm test
      - name: Paridade i18n (pt-BR / en / es)
        run: npm run i18n:check
      - name: Build de produção
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid
      - name: Dependências de produção sem vulnerabilidade alta ou crítica
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Segredos (gitleaks, histórico inteiro)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .

  commits:
    name: Conventional Commits (commitlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-fund
      - name: Mensagens do PR no padrão `tipo(escopo): assunto` (escopo rfNN opcional)
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
