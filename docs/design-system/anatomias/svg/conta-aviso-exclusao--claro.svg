5" class="lg"><tspan style="font-weight:700">Reativar</tspan><tspan class="m"> — Button primary sm com busy durante a chamada; mesma ação do card de exclusão (useReactivate).</tspan></text><text x="24" y="316" style="font-family:&quot;Public Sans&quot;, Inter, system-ui, &quot;Segoe UI&quot;, Roboto, sans-serif;font-size:10.5px;font-weight:500;fill:var(--muted);font-style:italic;">Situação: real (API). Uso: topo de todas as páginas do shell. Diagrama gerado por anatomias/gerar.mjs (não é captura do produto).</text></svg>
