CLUSÃO AGENDADA</text><g role="button"><rect x="530" y="16" width="98" height="26" rx="7" style="fill:var(--primary);stroke:var(--primary);stroke-width:1"/><text x="541" y="32.9" style="font-family:&quot;Public Sans&quot;, Inter, system-ui, &quot;Segoe UI&quot;, Roboto, sans-serif;font-size:10.5px;font-weight:600;fill:var(--on-primary);">Reativar conta</text></g><text x="139" y="25.5" style="font-family:&quot;Public Sans&quot;, Inter, system-ui, &quot;Segoe UI&quot;, Roboto, sans-serif;font-size:10.5px;font-weight:500;fill:var(--ink);">Sua conta será excluída em 16/11/2026 (faltam 30 dias). Até lá, você</text><text x="139" y="40.5" style="font-family:&quot;Public Sans&quot;, Inter, system-ui, &quot;Segoe UI&quot;, Roboto, sans-serif;font-size:10.5px;font-weight:500;fill:var(--ink);">pode reativá-la.</text></g><g aria-hidden="true" style="pointer-events:none"><path d="M28 24H46" style="fill:none;stroke:var(--muted);stroke-width:1;opacity:0.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="46" cy="24" r="2.6" style="fill:var(--primary-ink);stroke:var(--surface);stroke-width:1"/><path d="M28 46L42 43H62" style="fill:none;stroke:var(--muted);stroke-width:1;opacity:0.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="62" cy="43" r="2.6" style="fill:var(--primary-ink);stroke:var(--surface);stroke-width:1"/><path d="M704 21H370.64" style="fill:none;stroke:var(--muted);stroke-width:1;opacity:0.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="370.64" cy="21" r="2.6" style="fill:var(--primary-ink);stroke:var(--surface);stroke-width:1"/><path d="M704 43H675" style="fill:none;stroke:var(--muted);stroke-width:1;opacity:0.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="675" cy="43" r="2.6" style="fill:var(--primary-ink);stroke:var(--surface);stroke-width:1"/></g><g class="num"><circle cx="17" cy="24" r="10" style="fill:var(--ink);stroke:var(--surface);stroke-width:1.5"/><text x="17" y="28">1</text></g><g class="num"><rect x="9" y="38" width="16" height="16" rx="3" style="fill:var(--primary-ink);stroke:var(--surface);stroke-width:1.5"/><text x="17" y="49.6" style="font-size:9.5px">a</text></g><g class="num"><rect x="707" y="13" width="16" height="16" rx="3" style="fill:var(--primary-ink);stroke:var(--surface);stroke-width:1.5"/><text x="715" y="24.6" style="font-size:9.5px">b</text></g><g class="num"><rect x="707" y="35" width="16" height="16" rx="3" style="fill:var(--primary-ink);stroke:var(--surface);stroke-width:1.5"/><text x="715" y="46.6" style="font-size:9.5px">c</text></g></g><g class="num"><circle cx="32" cy="173" r="8" style="fill:var(--ink);stroke:var(--surface);stroke-width:1.5"/><text x="32" y="177">1</text></g><text x="48" y="177" class="lg"><tspan style="font-weight:700">Superfície</tspan><tspan class="m"> — ui/Card tone=&quot;soft&quot; com borda --ws-warning, role=&quot;status&quot;, no topo de TODAS as páginas do shell</tspan></text><text x="48" y="191" class="lg"><tspan class="m">(data-testid=&quot;deletion-banner&quot;); some quando a conta volta a ACTIVE. Real.</tspan></text><g class="num"><rect x="25" y="200" width="14" height="14" rx="3" style="fill:var(--primary-ink)"/><text x="32" y="210.6" style="font-size:9px">a</text></g><text x="48" y="211" class="lg"><tspan style="font-weight:700">Estado</tspan><tspan class="m"> — Badge âmbar &quot;Exclusão agendada&quot; (User.status = DELETION_SCHEDULED). Estado e ciclo de vida.</tspan></text><g class="num"><rect x="25" y="220" width="14" height="14" rx="3" style="fill:var(--primary-ink)"/><text x="32" y="230.6" style="font-size:9px">b</text></g><text x="48" y="231" class="lg"><tspan style="font-weight:700">Prazo</tspan><tspan class="m"> — deletionScheduledAt + dias restantes (daysLeft), em texto; ocupa o espaço que sobrar (flex-1) e quebra</tspan></text><text x="48" y="245" class="lg"><tspan class="m">no celular. Estado e ciclo de vida.</tspan></text><g class="num"><rect x="25" y="254" width="14" height="14" rx="3" style="fill:var(--primary-ink)"/><text x="32" y="264.6" style="font-size:9px">c</text></g><text x="48" y="265" class="lg"><tspan style="font-weight:700">Reativar</tspan><tspan class="m"> — Button primary sm com busy durante a chamada; mesma ação do card de exclusão (useReactivate).</tspan></text><text x="24" y="316" style="font-family:&quot;Public Sans&quot;, Inter, system-ui, &quot;Segoe UI&quot;, Roboto, sans-serif;font-size:10.5px;font-weight:500;fill:var(--muted);font-style:italic;">Situação: real (API). Uso: topo de todas as páginas do shell. Diagrama gerado por anatomias/gerar.mjs (não é captura do produto).</text></svg>
