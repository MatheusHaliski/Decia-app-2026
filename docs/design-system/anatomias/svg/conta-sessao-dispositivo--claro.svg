.6" style="font-size:9px">c</text></g><text x="48" y="347" class="lg"><tspan style="font-weight:700">Marcadores</tspan><tspan class="m"> — Badge &quot;Esta sessão&quot; (verde) se current; &quot;Lembrar-me&quot; (neutro) se persistent. Segurança.</tspan></text><g class="num"><rect x="25" y="356" width="14" height="14" rx="3" style="fill:var(--primary-ink)"/><text x="32" y="366.6" style="font-size:9px">d</text></g><text x="48" y="367" class="lg"><tspan style="font-weight:700">Datas</tspan><tspan class="m"> — lastActiveAt e expiresAt em data e hora (Intl, dateStyle medium + timeStyle short). Proveniência e</tspan></text><text x="48" y="381" class="lg"><tspan class="m">auditoria.</tspan></text><g class="num"><rect x="25" y="390" width="14" height="14" rx="3" style="fill:var(--primary-ink)"/><text x="32" y="400.6" style="font-size:9px">e</text></g><text x="48" y="401" class="lg"><tspan style="font-weight:700">Sair daqui</tspan><tspan class="m"> — na sessão atual: ghost &quot;Sair deste dispositivo&quot; → logout do BFF (apaga cookies, avisa as outras</tspan></text><text x="48" y="415" class="lg"><tspan class="m">abas).</tspan></text><g class="num"><rect x="25" y="424" width="14" height="14" rx="3" style="fill:var(--primary-ink)"/><text x="32" y="434.6" style="font-size:9px">f</text></g><text x="48" y="435" class="lg"><tspan style="font-weight:700">Encerrar</tspan><tspan class="m"> — nas outras: secondary &quot;Encerrar sessão&quot; → Dialog de confirmação → DELETE /api/auth/sessions/{id}.</tspan></text><text x="24" y="486" style="font-family:&quot;Public Sans&quot;, Inter, system-ui, &quot;Segoe UI&quot;, Roboto, sans-serif;font-size:10.5px;font-weight:500;fill:var(--muted);font-style:italic;">Situação: real (API). Uso: Configurações › Sessões. Diagrama gerado por anatomias/gerar.mjs (não é captura do produto).</text></svg>
