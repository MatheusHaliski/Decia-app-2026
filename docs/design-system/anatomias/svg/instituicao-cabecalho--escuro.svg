="fill:var(--primary-ink)"/><text x="32" y="302.6" style="font-size:9px">a</text></g><text x="48" y="303" class="lg"><tspan style="font-weight:700">Monograma</tspan><tspan class="m"> — Department.color + sigla sem &quot;SECID-&quot; (3 letras), 64 px; empresa = Monogram laranja com o slug. Identificação.</tspan></text><g class="num"><rect x="25" y="312" width="14" height="14" rx="3" style="fill:var(--primary-ink)"/><text x="32" y="322.6" style="font-size:9px">b</text></g><text x="48" y="323" class="lg"><tspan style="font-weight:700">Sigla</tspan><tspan class="m"> — Department.acronym (display h2); empresa: legalName. Identificação.</tspan></text><g class="num"><rect x="25" y="332" width="14" height="14" rx="3" style="fill:var(--primary-ink)"/><text x="32" y="342.6" style="font-size:9px">c</text></g><text x="48" y="343" class="lg"><tspan style="font-weight:700">Nome · empresa</tspan><tspan class="m"> — Department.name + link para a empresa (RF15); empresa mostra &quot;/companies/{slug} · métricas públicas&quot;. Institucional.</tspan></text><g class="num"><rect x="25" y="352" width="14" height="14" rx="3" style="fill:var(--primary-ink)"/><text x="32" y="362.6" style="font-size:9px">d</text></g><text x="48" y="363" class="lg"><tspan style="font-weight:700">Chefe</tspan><tspan class="m"> — headUserId → avatar + &quot;Chefe da {sigla}:&quot; + link para o perfil pessoal (RF16); sem chefe = texto &quot;sem chefe&quot;. Institucional.</tspan></text><g class="num"><rect x="25" y="372" width="14" height="14" rx="3" style="fill:var(--primary-ink)"/><text x="32" y="382.6" style="font-size:9px">e</text></g><text x="48" y="383" class="lg"><tspan style="font-weight:700">Seguir</tspan><tspan class="m"> — FollowButton targetType DEPARTMENT/COMPANY (aria-pressed).</tspan></text><g class="num"><rect x="25" y="392" width="14" height="14" rx="3" style="fill:var(--primary-ink)"/><text x="32" y="402.6" style="font-size:9px">f</text></g><text x="48" y="403" class="lg"><tspan style="font-