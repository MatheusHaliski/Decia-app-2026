7" class="lg"><tspan class="m">e invisível = inexistente (404); a variação só vale se</tspan></text><text x="476" y="341" class="lg"><tspan class="m">a visibilidade de perfil for criada (lacuna</tspan></text><text x="476" y="355" class="lg"><tspan class="m">&quot;descoberta do perfil / visibilidade por campo&quot;,</tspan></text><text x="476" y="369" class="lg"><tspan class="m">ATORES_E_ATRIBUTOS §5.3). Classificação e</tspan></text><text x="476" y="383" class="lg"><tspan class="m">visibilidade.</tspan></text><g class="num"><rect x="453" y="392" width="14" height="14" rx="3" style="fill:var(--primary-ink)"/><text x="460" y="402.6" style="font-size:9px">h</text></g><text x="476" y="403" class="lg"><tspan style="font-weight:700">Ações</tspan><tspan class="m"> — Seguir (aria-pressed); sem &quot;Ver perfil&quot;</tspan></text><text x="476" y="417" class="lg"><tspan class="m">enquanto restrito.</tspan></text><text x="24" y="462" style="font-family:&quot;Public Sans&quot;, Inter, system-ui, &quot;Segoe UI&quot;, Roboto, sans-serif;font-size:10.5px;font-weight:500;fill:var(--muted);font-style:italic;">Situação: planejado (sem código). Uso: /search › PESSOAS, se houver visibilidade de perfil. Diagrama, não captura do produto.</text></svg>
