m foto nem anel de</tspan></text><text x="476" y="163" class="lg"><tspan class="m">cor. Identificação.</tspan></text><g class="num"><rect x="453" y="172" width="14" height="14" rx="3" style="fill:var(--primary-ink)"/><text x="460" y="182.6" style="font-size:9px">b</text></g><text x="476" y="183" class="lg"><tspan style="font-weight:700">Nome</tspan><tspan class="m"> — PublicProfileView.fullName/displayName (fonte</tspan></text><text x="476" y="197" class="lg"><tspan class="m">real em curso: GET /api/people/by-username).</tspan></text><text x="476" y="211" class="lg"><tspan class="m">Identificação.</tspan></text><g class="num"><rect x="453" y="220" width="14" height="14" rx="3" style="fill:var(--primary-ink)"/><text x="460" y="230.6" style="font-size:9px">c</text></g><text x="476" y="231" class="lg"><tspan style="font-weight:700">@username · cargo</tspan><tspan class="m"> — só @username: cargo e lotação</tspan></text><text x="476" y="245" class="lg"><tspan class="m">somem. Identificação.</tspan></text><g class="num"><rect x="453" y="254" width="14" height="14" rx="3" style="fill:var(--primary-ink)"/><text x="460" y="264.6" style="font-size:9px">f</text></g><text x="476" y="265" class="lg"><tspan style="font-weight:700">Contadores ocultos</tspan><tspan class="m"> — &quot;—&quot; com sr-only &quot;oculto para</tspan></text><text x="476" y="279" class="lg"><tspan class="m">você&quot;, igual ao cabeçalho do perfil.</tspan></text><g class="num"><rect x="453" y="288" width="14" height="14" rx="3" style="fill:var(--primary-ink)"/><text x="460" y="298.6" style="font-size:9px">g</text></g><text x="476" y="299" class="lg"><tspan style="font-weight:700">Aviso de restrição</tspan><tspan class="m"> — cadeado + texto em itálico.</tspan></text><text x="476" y="313" class="lg"><tspan class="m">PROPOSTA: o domínio hoje não tem perfil privado (D-90)</tspan></text><text x="476" y="327" class="lg"><tspan class="m">e invisível = inexistente (404); a variação só vale se</tspan></text><text x="476" y="341" class="lg"><tspan class="m">a visibilidade de perfil for criada (lacuna</tspan></text><text x="476" y="355" class="lg"><tspan class="m">&quot;descoberta do perfil / visibilidade por campo&quot;,</tspan></text><text x="476" y="369" class="lg"><tspan class="m">ATORES_E_ATRIBUTOS §5.3). Classificação e</tspan></text><text x="476" y="383" class="lg"><tspan class="m">visibilidade.</tspan></text><g class="num"><rect x="453" y="392" width="14" height="14" rx="3" style="fill:var(--primary-ink)"/><text x="460" y="402.6" style="font-size:9px">h</text></g><text x="476" y="403" class="lg"><tspan style="font-weight:700">Ações</tspan><tspan class="m"> — Seguir (aria-pressed); sem &quot;Ver perfil&quot;</tspan></text><text x="476" y="417" class="lg"><tspan class="m">enquanto restrito.</tspan></text><text x="24" y="462" style="font-family:&quot;Public Sans&quot;, Inter, system-ui, &quot;Segoe UI&quot;, Roboto, sans-serif;font-size:10.5px;font-weight:500;fill:var(--muted);font-style:italic;">Situação: planejado (sem código). Uso: /search › PESSOAS, se houver visibilidade de perfil. Diagrama, não captura do produto.</text></svg>
