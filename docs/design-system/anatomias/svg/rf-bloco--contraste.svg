 x="25" y="452" width="14" height="14" rx="3" style="fill:var(--primary-ink)"/><text x="32" y="462.6" style="font-size:9px">e</text></g><text x="48" y="463" class="lg"><tspan style="font-weight:700">Rota · cobertura</tspan><tspan class="m"> — RfEntry.route e coverage, quando existem.</tspan></text><g class="num"><rect x="25" y="472" width="14" height="14" rx="3" style="fill:var(--primary-ink)"/><text x="32" y="482.6" style="font-size:9px">f</text></g><text x="48" y="483" class="lg"><tspan style="font-weight:700">Tipo do CA</tspan><tspan class="m"> — Badge com o número do CA: info = enunciado, neutro = rastreabilidade (title explica a</tspan></text><text x="48" y="497" class="lg"><tspan class="m">diferença).</tspan></text><g class="num"><rect x="25" y="506" width="14" height="14" rx="3" style="fill:var(--primary-ink)"/><text x="32" y="516.6" style="font-size:9px">g</text></g><text x="48" y="517" class="lg"><tspan style="font-weight:700">Texto do CA</tspan><tspan class="m"> — ca.text + ca.note entre parênteses em muted; ol[aria-label=&quot;Critérios de aceite&quot;].</tspan></text><g class="num"><rect x="25" y="526" width="14" height="14" rx="3" style="fill:var(--primary-ink)"/><text x="32" y="536.6" style="font-size:9px">h</text></g><text x="48" y="537" class="lg"><tspan style="font-weight:700">Fonte</tspan><tspan class="m"> — link para docs/diagramas/RFnn/README.md no GitHub. Proveniência e auditoria. Abaixo do</tspan></text><text x="48" y="551" class="lg"><tspan class="m">bloco, o Card soft &quot;matrixNote&quot; diz matriz, rota e arquivo da página.</tspan></text><text x="24" y="602" style="font-family:&quot;Public Sans&quot;, Inter, system-ui, &quot;Segoe UI&quot;, Roboto, sans-serif;font-size:10.5px;font-weight:500;fill:var(--muted);font-style:italic;">Situação: real (catálogo gerado). Uso: rodapé de toda página RfPage (&quot;O que esta aba vai fazer&quot;).</text></svg>
