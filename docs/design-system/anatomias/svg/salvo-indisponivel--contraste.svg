O.</tspan></text><g class="num"><rect x="413" y="138" width="14" height="14" rx="3" style="fill:var(--primary-ink)"/><text x="420" y="148.6" style="font-size:9px">a</text></g><text x="436" y="149" class="lg"><tspan style="font-weight:700">Estado</tspan><tspan class="m"> — Badge neutro &quot;Indisponível&quot; ←</tspan></text><text x="436" y="163" class="lg"><tspan class="m">savedListOf(...).available = false. Classificação e</tspan></text><text x="436" y="177" class="lg"><tspan class="m">visibilidade.</tspan></text><g class="num"><rect x="413" y="186" width="14" height="14" rx="3" style="fill:var(--primary-ink)"/><text x="420" y="196.6" style="font-size:9px">b</text></g><text x="436" y="197" class="lg"><tspan style="font-weight:700">Explicação</tspan><tspan class="m"> — diz o porquê sem revelar o item</tspan></text><text x="436" y="211" class="lg"><tspan class="m">(invisível = inexistente, D-65/D-141).</tspan></text><g class="num"><rect x="413" y="220" width="14" height="14" rx="3" style="fill:var(--primary-ink)"/><text x="420" y="230.6" style="font-size:9px">c</text></g><text x="436" y="231" class="lg"><tspan style="font-weight:700">Título oculto</tspan><tspan class="m"> — p.sr-only com o título apenas se o</tspan></text><text x="436" y="245" class="lg"><tspan class="m">item ainda existe para o viewer.</tspan></text><g class="num"><rect x="413" y="254" width="14" height="14" rx="3" style="fill:var(--primary-ink)"/><text x="420" y="264.6" style="font-size:9px">d</text></g><text x="436" y="265" class="lg"><tspan style="font-weight:700">Remover</tspan><tspan class="m"> — Button → toggleSave (desfaz o SavedItem) com</tspan></text><text x="436" y="279" class="lg"><tspan class="m">toast &quot;removido dos salvos&quot;.</tspan></text><text x="24" y="324" style="font-family:&quot;Public Sans&quot;, Inter, system-ui, &quot;Segoe UI&quot;, Roboto, sans-serif;font-size:10.5px;font-weight:500;fill:var(--muted);font-style:italic;">Situação: DEMO (repositório em memória). Uso: P