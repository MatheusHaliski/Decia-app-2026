<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Notificações"><title>Notificações</title><style>@keyframes ws-pulse{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(1.25)}}@keyframes ws-blink{0%,49%{opacity:1}50%,100%{opacity:0}}.ws-pulse{transform-origin:12px 9.25px;animation:ws-pulse var(--ws-duration-pulse,1800ms) var(--ws-ease,ease-out) infinite}.ws-blink{animation:ws-blink var(--ws-duration-blink,1000ms) steps(1) infinite}@media(prefers-reduced-motion:reduce){.ws-pulse,.ws-blink{animation:none;opacity:1}}</style><rect x="2.5" y="3" width="19" height="12.5" rx="2.5" fill="var(--ws-ink, #242525)" stroke="var(--ws-glyph-rim, transparent)" stroke-width="0.75"/><path d="M5 3.6h14a1.9 1.9 0 0 1 1.9 1.9v0.6h-17.8v-0.6a1.9 1.9 0 0 1 1.9-1.9z" fill="var(--ws-glyph-shine, rgba(102,99,98,.55))"/><rect x="4.25" y="4.75" width="15.5" height="9" rx="1.25" fill="var(--ws-glyph-screen, #47443C)" stroke="none"/><rect x="11" y="15" width="2" height="3.25" rx="0.5" fill="var(--ws-ink, #242525)" stroke="none"/><rect x="8.25" y="17.75" width="7.5" height="2" rx="1" fill="var(--ws-ink, #242525)" stroke="none"/><circle cx="12" cy="9.25" r="4.25" fill="none" stroke="var(--ws-cream, #F1DEC0)" stroke-width="1.1" class="ws-pulse"/><circle cx="12" cy="9.25" r="2" fill="var(--ws-node-orange, #FCB809)" stroke="none" class="ws-node"/></svg>
