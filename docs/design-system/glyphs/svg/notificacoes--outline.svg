<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Notificações"><title>Notificações</title><style>@keyframes ws-pulse{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(1.25)}}@keyframes ws-blink{0%,49%{opacity:1}50%,100%{opacity:0}}.ws-pulse{transform-origin:12px 9.25px;animation:ws-pulse var(--ws-duration-pulse,1800ms) var(--ws-ease,ease-out) infinite}.ws-blink{animation:ws-blink var(--ws-duration-blink,1000ms) steps(1) infinite}@media(prefers-reduced-motion:reduce){.ws-pulse,.ws-blink{animation:none;opacity:1}}</style><rect x="2.5" y="3" width="19" height="12.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M12 15.5v2.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.5 20.5h7" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="9.25" r="1.75" fill="var(--ws-node-orange, #FCB809)" stroke="none" class="ws-node"/><circle cx="12" cy="9.25" r="4" fill="none" stroke="currentColor" stroke-width="1.4" class="ws-pulse"/></svg>
