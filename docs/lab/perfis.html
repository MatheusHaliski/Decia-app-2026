  { n: 13, l: 'DECIA Points', rf: 'RF42', self: true, ep: 'GET /api/me/points', desc: 'saldo, extrato, regras, Loja' },
  { n: 14, l: 'Hype Score do Perfil', rf: 'RF45', self: true, ep: 'GET /api/me/profile/hype', desc: '0–1000, faixa, decomposição, PÚBLICO / EMPRESA / SÓ EU' },
  { n: 15, l: 'Perfil deliberativo (completo)', rf: 'RF43', self: true, ep: 'GET /api/me/deliberative-profile', desc: 'clareza, evidências, consistência, completude, reutilização; insights da IA' },
];
/* Alterações por perfil nas 15 sub-abas (§7.d) */
const PERSONAL_OVERRIDES = {
  empresa: { 5: { off: 'objetivo 2 é por pessoa' }, 15: { off: 'objetivo 2 é por pessoa' }, 9: { off: 'conta institucional (P-09)' }, 13: { off: 'não acumula DP (P-10)' }, 14: { off: 'índice por pessoa (RF45)' },
    6: { rename: 'Plano Anual oficial', pub: true }, 11: { rename: 'Modelos oficiais', pub: true }, 12: { rename: 'Emitidos (reconhecimentos e chancelas)', pub: true } },
  chefe: { 12: { rename: 'Meus Reconhecimentos e Chancelas · Emitidos' } },
};
/* Página da empresa (RF28, board2.md:553) e do departamento (board2.md:556). */
const COMPANY_TABS = [
  { l: 'Sobre', rf: 'RF28.CA04', ep: 'GET /api/companies/{slug}', w: ['empresa'] },
  { l: 'Departamentos', rf: 'RF28.CA02', ep: 'POST …/departments · requireRole(EMPRESA)', w: ['empresa'] },
  { l: 'Programas', rf: 'RF25', ep: 'GET …/groupings?type=PROGRAMA', w: ['empresa'] },
  { l: 'Plano Anual oficial', rf: 'RF24.CA04', ep: 'POST /api/plans/{id}/derive', w: ['empresa'] },
  { l: 'Chancelas e modelos oficiais', rf: 'RF39', ep: 'POST /api/seals · requireIssuer', w: ['empresa'] },
  { l: 'Benefícios', rf: 'RF39.CA09', ep: 'POST /api/benefits/{id}/redeem', w: ['empresa'] },
  { l: 'Destaques', rf: 'RF35.CA03', ep: 'POST /api/highlights/{id}/curate', w: ['empresa', 'chefe', 'curador'] },
  { l: 'Pessoas', rf: 'RF28.CA02', ep: 'POST /api/departments/{id}/members', w: ['empresa', 'chefe'] },
  { l: 'Comunicados', rf: 'RF28 (P-06)', ep: 'POST …/announcements · requireIssuer', w: ['empresa', 'chefe'], prop: true },
  { l: 'Gestão', rf: '§7.c', ep: 'PUT …/policies/* · requireRole(EMPRESA)', w: ['empresa'], own: true, prop: true },
];
const DEPT_TABS = [
  { l: 'Sobre', rf: 'RF28', ep: 'GET /api/departments/{slug}', w: ['chefe', 'empresa'] },
  { l: 'Projetos do departamento', rf: 'RF28', ep: 'GET …/projects?fase=', w: ['chefe'] },
  { l: 'Sessões DECIA', rf: 'RF28 §3', ep: 'GET …/sessions?status=', w: ['chefe'] },
  { l: 'Chancelas e fila de revisão', rf: 'RF39', ep: 'GET /api/seal-bonds/review-queue?dept= · requireIssuerOrCurator', w: ['chefe', 'curador'] },
  { l: 'Reconhecimentos emitidos', rf: 'RF35.CA04', ep: 'POST /api/recognitions · requireIssuer', w: ['chefe'] },
  { l: 'Equipe (com curadores)', rf: 'RF28', ep: 'GET …/team', w: [] },
  { l: 'Minha equipe (gestão)', rf: 'RF9/RF10/RF28 (P-08)', ep: 'GET …/team/manage · requireDeptHead', w: ['chefe'], own: true, prop: true },
  { l: 'Dashboard do emissor', rf: 'RF28.CA06', ep: 'GET /api/issuer/dashboard?dept=', w: ['chefe'], own: true },
  { l: 'Insights da Equipe', rf: 'RF43.CA14', ep: 'GET /api/insights/team?dept=', w: ['chefe'], own: true },
];
const TEAM_BLOCKS = [
  ['Lista e lotação', 'RF9 · RF28.CA02/CA03', 'adicionar/remover, transferir, nomear curador'],
  ['Carga e balanceamento', 'RF43 §8-D', 'WIP × limite, utilização ≤ 80 %, bus factor'],
  ['Atribuir tarefa/projeto', 'RF10', 'responsável + prazo; aceite/recusa'],
  ['Tarefa do Dia agregada', 'RF44 · RF45.CA10', 'CONCLUÍ/ADIEI/BLOQUEADA/DELEGUEI por dia; HSE médio (sem nominal)'],
  ['Pendências e prazos', 'RF28.CA06 · RF41.CA04', 'bloqueadas, prazos legais, SPI < 0,9'],
  ['Fila de chancelas e revisões', 'RF39.CA04 · RF15 · RF42.CA07', 'vínculos, decisões, lançamentos suspensos'],
  ['Insights da Equipe', 'RF43.CA14', 'pesquisas anônimas ≥ 5'],
  ['Reconhecimentos emitidos', 'RF28.CA05 · RF35.CA06', 'limite mensal'],
  ['Dossiês de transição', 'RF36', 'saída, transferência, sucessor'],
];
const NOT_SEEN = ['Hype SÓ EU (RF45.CA06/CA08/CA10)', 'perfil deliberativo completo (RF43.CA04)', 'HSE nominal (RF44.CA07)', 'saldo DP individual (RF42.CA08)', 'itens PRIVADOS (RF36.CA05)', 'e-mail/telefone (AES)'];

const THEMES = [['claro', 'Claro'], ['escuro', 'Escuro'], ['contraste', 'Alto contraste'], ['blueprint', 'Blueprint']];
const state = { perfil: 'empregado', visao: 'proprio', tema: 'claro' };
const q = new URLSearchParams(location.search);
if (PROFILES[q.get('perfil')]) state.perfil = q.get('perfil');
if (['proprio', 'terceiro'].includes(q.get('visao'))) state.visao = q.get('visao');
if (THEMES.some(([t]) => t === q.get('tema'))) state.tema = q.get('tema');

const tag = (txt, attrs = '') => `<span class="ws-tag" ${attrs}>${txt}</span>`;
const TAG = { E: tag('E', 'data-status="aprovado" title="editável"'), V: tag('V', 'title="visível"'), O: tag('oculta', 'data-state="arquivada"'), P: tag('proposta', 'data-state="modelo-publico"') };

function radios(el, name, opts, cur, on) {
  el.innerHTML = opts.map(([v, l]) => `<button type="button" class="ws-btn ws-btn--sm ${v === cur ? 'ws-btn--primary' : ''}" role="radio" aria-checked="${v === cur}" data-v="${v}">${l}</button>`).join('');
  el.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => on(b.dataset.v)));
}

function renderSidebar(p) {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = p.sidebar.map((g) => `<section><p class="ws-nav__group">${g.label}</p>${g.items.map((it) => `<a class="ws-nav__link" href="#" aria-current="${it.current ? 'page' : 'false'}" data-write="${!!it.write}" title="${it.rf}">${ico(it.i)}<span class="ws-nav__label">${it.l}${it.prop ? ' ✦' : ''}</span>${it.badge ? `<span class="ws-nav__badge">${it.badge}</span>` : ''}</a>`).join('')}</section>`).join('')
    + `<p class="lab-note" style="padding:0 .6rem">✦ = proposta · E = edita · badge = pendências</p>`;
  const bn = document.getElementById('bottomnav');
  const items = state.perfil === 'empresa' ? ['Mural', 'Buscar', '+', 'Acervo', 'Empresa'] : ['Mural', 'Buscar', '+', 'Acervo', 'Perfil'];
  bn.innerHTML = items.map((l, i) => l === '+' ? `<a href="#"><span class="lab-plus">${ico('create')}</span><span>Criar</span></a>` : `<a href="#" aria-current="${i === 4 ? 'page' : 'false'}">${ico(['mural', 'search', '', 'tasks', 'profile'][i])}<span>${l}</span></a>`).join('');
}

function renderHeader(p) {
  const self = state.visao === 'proprio';
  const avatar = p.person ? `<span class="ws-avatar" aria-hidden="true">${p.avatar}</span>` : `<span class="ws-monogram" style="--d: var(--dept-gralha-azul)" aria-hidden="true">${p.avatar}</span>`;
  let hype = '';
  if (p.hype) {
    const show = self || p.hype.vis === 'PÚBLICO' || p.hype.vis === 'EMPRESA';
    hype = show ? `<span class="lab-hype" title="Hype Score do Perfil (RF45) · visibilidade ${p.hype.vis}">✦ Hype ${p.hype.score} · ${p.hype.band}</span>` : `<span class="lab-hype" style="opacity:.5">Hype oculto (SÓ EU)</span>`;
  }
  const kind = p.person ? '' : ' · ' + tag('Perfil institucional', 'data-status="publicado"');
  document.getElementById('top-avatar').textContent = p.avatar;
  document.getElementById('header').innerHTML = `${avatar}<div><h1 class="type-h1">${p.name}${p.tag ? ' ' + tag(p.tag, 'data-state="modelo-publico"') : ''}</h1>
    <div class="lab-sub type-body-sm">${p.sub.map((s) => `<span>${s}</span>`).join('<span aria-hidden="true">·</span>')}${kind} ${hype}</div>
    <div class="lab-counters">${p.counters.filter(([, l]) => self || !/DECIA Points/.test(l)).map(([n, l]) => `<div><b>${n}</b><span>${l}</span></div>`).join('')}</div></div>
    <div class="lab-actions">${(self ? p.actions.self : p.actions.other).map((a, i) => `<span class="ws-btn ws-btn--sm ${i === 0 ? 'ws-btn--primary' : ''}">${a}</span>`).join('')}<span class="type-caption">= FAI ${p.fai}</span></div>`;
}

function renderTabs(p) {
  const self = state.visao === 'proprio';
  const ov = PERSONAL_OVERRIDES[state.perfil] || {};
  const sec = document.getElementById('tabs-section');
  const tabs = PERSONAL_TABS.map((t) => { const o = ov[t.n] || {}; const isSelf = t.self && !o.pub; const hidden = o.off || (isSelf && !self); return { ...t, o, hidden, label: o.rename || t.l, isSelf }; });
  sec.innerHTML = `<h2 class="type-h2">${p.person ? 'Perfil pessoal' : 'Perfil da conta'} — sub-abas do RF19 <span class="type-caption">${self ? 'visão do dono (self)' : 'visão de terceiro: sub-abas 6–15 omitidas pela API (RF19.CA02)'}</span></h2>
    <div class="lab-tabs" role="tablist">${tabs.map((t, i) => `<span class="lab-tab" role="tab" aria-selected="${i === 0}" data-hidden="${!!t.hidden}"><small>${t.n}</small>${t.label}</span>`).join('')}</div>
    <div class="lab-grid">${tabs.map((t) => `<article class="lab-tabcard" data-hidden="${!!t.hidden}"><h3><small class="type-label">${t.n}</small>${t.label} ${t.hidden ? TAG.O : (self ? TAG.E : TAG.V)}${t.o.rename || t.o.off ? TAG.P : ''}</h3>
      <p>${t.o.off ? 'Some: ' + t.o.off : t.desc}</p><div class="ws-skeleton ws-skeleton--text"></div><div class="ws-skeleton ws-skeleton--text short"></div>
      <code>${t.ep}${t.isSelf ? ' · requireOwner' : ' · canView'}</code><span class="type-caption">${t.rf}${t.isSelf ? ' · só o dono' : ' · todos'}</span></article>`).join('')}</div>`;
}

function renderInstitutional(p) {
  const sec = document.getElementById('inst-section'); const self = state.visao === 'proprio';
  const role = state.perfil;
  if (role === 'empregado' || role === 'admin') { sec.hidden = true; return; }
  sec.hidden = false;
  const list = role === 'empresa' ? COMPANY_TABS : DEPT_TABS;
  const title = role === 'empresa' ? 'Página da empresa · /companies/secid (RF28, Matriz C)' : `Página do departamento · /departments/secid-uts (RF28, Matriz D) — ${role === 'chefe' ? 'o chefe administra' : 'curadora opera fila e premiação em nome do chefe'}`;
  const cards = list.map((t) => {
    const can = t.w.includes(role) && self; const hidden = t.own && !(self && (role === 'empresa' || role === 'chefe'));
    return { ...t, can, hidden };
  });
  sec.innerHTML = `<h2 class="type-h2">${title}</h2>
    <div class="lab-tabs" role="tablist">${cards.map((t, i) => `<span class="lab-tab" role="tab" aria-selected="${i === 0}" data-hidden="${t.hidden}">${t.l}${t.prop ? ' ✦' : ''}</span>`).join('')}</div>
    <div class="lab-grid">${cards.map((t) => `<article class="lab-tabcard" data-hidden="${t.hidden}"><h3>${t.l} ${t.hidden ? TAG.O : (t.can ? TAG.E : TAG.V)}${t.prop ? TAG.P : ''}</h3>
      <div class="ws-skeleton ws-skeleton--text"></div><code>${t.ep}</code><span class="type-caption">${t.rf}</span></article>`).join('')}</div>`;
}

function renderManage(p) {
  const sec = document.getElementById('manage-section'); const self = state.visao === 'proprio';
  const role = state.perfil;
  if (!self || !['chefe', 'empresa', 'curador', 'admin'].includes(role)) { sec.hidden = true; return; }
  sec.hidden = false;
  if (role === 'chefe') {
    sec.innerHTML = `<h2 class="type-h2">Minha equipe — modo gestão ${TAG.P} <span class="type-caption">§7.b · só o chefe (requireDeptHead); EMPRESA em leitura</span></h2>
      <div class="lab-kpis"><div class="lab-kpi"><span>pessoas</span><b>14</b></div><div class="lab-kpi"><span>WIP acima do limite</span><b>3</b></div><div class="lab-kpi"><span>prazos em risco</span><b>5</b></div><div class="lab-kpi"><span>fila de chancelas</span><b>7</b></div><div class="lab-kpi"><span>HSE médio (7 d)</span><b>71</b></div><div class="lab-kpi"><span>CONCLUÍ hoje</span><b>9/14</b></div></div>
      <div class="lab-grid">${TEAM_BLOCKS.map(([l, rf, d]) => `<article class="lab-tabcard"><h3>${l} ${TAG.E}</h3><p>${d}</p><div class="ws-skeleton ws-skeleton--text"></div><span class="type-caption">${rf}</span></article>`).join('')}</div>
      <p class="lab-note"><b>O chefe não vê:</b> ${NOT_SEEN.join(' · ')}.</p>`;
  } else if (role === 'empresa') {
    const items = ['Departamentos & chefes', 'Pessoas & lotações', 'Chancelas & políticas de concessão', 'Benefícios', 'Plano Anual oficial', 'Programas', 'Políticas (DP · HSE · Ranking · Hype · Gravação · Reconhecimentos/mês)', 'Dashboard do emissor', 'Insights da empresa', 'Dossiês', 'Comunicados'];
    sec.innerHTML = `<h2 class="type-h2">Gestão da empresa ${TAG.P} <span class="type-caption">§7.c · só a dona (requireRole(EMPRESA) + requireOwner); negado no serviço</span></h2>
      <div class="lab-kpis"><div class="lab-kpi"><span>projetos por fase</span><b>128</b></div><div class="lab-kpi"><span>prazos em risco</span><b>11</b></div><div class="lab-kpi"><span>decisões em revisão</span><b>4</b></div><div class="lab-kpi"><span>fila de chancelas</span><b>9</b></div><div class="lab-kpi"><span>custo de IA (mês)</span><b>R$ 0</b></div><div class="lab-kpi"><span>benefícios resgatados</span><b>63</b></div></div>
      <div class="lab-grid">${items.map((l) => `<article class="lab-tabcard"><h3>${l} ${TAG.E}</h3><div class="ws-skeleton ws-skeleton--text"></div><div class="ws-skeleton ws-skeleton--text short"></div></article>`).join('')}</div>`;
  } else if (role === 'curador') {
    const items = [['Fila de revisão (3)', 'RF39.CA04 · scope FILA_REVISAO', 'aprovar/rejeitar em nome do chefe'], ['Premiação & Destaques', 'RF35.CA03 · RF39.CA05 · scope PREMIACAO', 'triagem dos destaques; Chancela de Excelência'], ['Indicações recebidas (2)', 'RF39.CA06', 'não revisa a própria indicação (P-20)'], ['Propostas de chancela', 'RF39.CA06', 'recomendar criar/recusar — a criação é do chefe (P-07)'], ['Sugeridos ao chefe (Balcão)', 'RF40.CA07 (P-19)', 'pré-seleção de modelos da comunidade'], ['Métricas da curadoria', 'RF39.CA11', 'revisados, tempo médio, taxa de aprovação']];
    sec.innerHTML = `<h2 class="type-h2">Curadoria ${TAG.P} <span class="type-caption">§7.e · requireCurator(dept, scope); não cria chancelas nem vê Dashboard/Insights da equipe</span></h2>
      <div class="lab-grid">${items.map(([l, rf, d]) => `<article class="lab-tabcard"><h3>${l} ${TAG.E}</h3><p>${d}</p><div class="ws-skeleton ws-skeleton--text"></div><span class="type-caption">${rf}</span></article>`).join('')}</div>`;
  } else {
    const items = [['Dashboard', 'RF18 · GET /api/admin/dashboard'], ['Aprovações EMPRESA/CHEFE (3)', 'RF28.CA01 · POST /api/admin/approvals/{userId}'], ['Usuários', 'status · papel'], ['Moderação', 'RF18'], ['IA do sistema', 'RF43.CA12 · custo, latência, fallback, cotas'], ['Auditoria', 'audit_log'], ['Sistema', 'backups · jobs · recalibração do Hype']];
    sec.innerHTML = `<h2 class="type-h2">Admin · /admin <span class="type-caption">requireAdmin; o admin não vê sub-abas 9/13/14/15 de terceiros (P-05)</span></h2>
      <div class="lab-grid">${items.map(([l, rf]) => `<article class="lab-tabcard"><h3>${l} ${TAG.E}</h3><div class="ws-skeleton ws-skeleton--text"></div><span class="type-caption">${rf}</span></article>`).join('')}</div>`;
  }
}

function render() {
  const p = PROFILES[state.perfil];
  document.documentElement.dataset.theme = state.tema;
  radios(document.getElementById('ctl-perfil'), 'perfil', Object.entries(PROFILES).map(([k, v]) => [k, v.label]), state.perfil, (v) => { state.perfil = v; render(); });
  radios(document.getElementById('ctl-visao'), 'visao', [['proprio', 'Próprio perfil'], ['terceiro', 'Como terceiro']], state.visao, (v) => { state.visao = v; render(); });
  radios(document.getElementById('ctl-tema'), 'tema', THEMES, state.tema, (v) => { state.tema = v; render(); });
  renderSidebar(p); renderHeader(p); renderTabs(p); renderInstitutional(p); renderManage(p);
  document.getElementById('foot').textContent = `perfis.html?perfil=${state.perfil}&visao=${state.visao}&tema=${state.tema} · wireframe estático; nenhum dado real. Fontes e regras em docs/produto/ABAS_POR_PERFIL.md.`;
  try { history.replaceState(null, '', `?perfil=${state.perfil}&visao=${state.visao}&tema=${state.tema}`); } catch (e) { /* file:// */ }
}
render();
</script>
</body>
